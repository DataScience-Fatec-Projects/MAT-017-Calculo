name: Publicar Guia P2 no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "2-Bimestre/guia-p2/**"
      - ".github/workflows/guia-p2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar KaTeX (só para validar o LaTeX)
        run: mkdir -p "$RUNNER_TEMP/k" && cd "$RUNNER_TEMP/k" && npm init -y >/dev/null && npm install katex@0.16.11
      - name: Verificar conteúdo (respostas + LaTeX)
        working-directory: 2-Bimestre/guia-p2
        env:
          KATEX_PATH: ${{ runner.temp }}/k/node_modules/katex
        run: node tools/verificar.mjs

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 2-Bimestre/guia-p2
      - id: deployment
        uses: actions/deploy-pages@v4
